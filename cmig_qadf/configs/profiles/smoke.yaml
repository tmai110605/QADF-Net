# Profile: SMOKE (End-to-end pipeline check in < 15 mins)
profile: "smoke"
is_smoke: true
watermark: "SMOKE (Not for publication)"

data:
  image_size: 224
  subset_patients: 30        # Small subset for quick execution
  use_clahe: true

model:
  backbone: "efficientnet_b4"
  grid_size: 7               # 7x7 tokens for fast compute

quality:
  estimator_epochs: 2
  estimator_input_size: 112

train:
  batch_size: 8
  accum_steps: 1
  epochs: 2
  warmup_epochs: 0
  patience: 2
  num_workers: 0

eval:
  bootstrap_reps: 50
  degradation_levels: [0, 2, 5] # Reduced levels
  degradation_types: ["gaussian_blur", "dark", "jpeg"]

seeds: [42]
methods: ["qc_sca", "concat", "average", "q_weighted", "cross_attn", "single_v1"]
backbones: ["efficientnet_b4"]
